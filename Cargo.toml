[package]
name = "vitrine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
urlencoding = "2"
wasm-bindgen = "0.2"
worker = { version = "0.8", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
